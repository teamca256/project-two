<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Doctor Appointment</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="l.css" />
  </head>

  <body>
    <main>
      <!-- Doctor Card -->
      <div class="container-appoinments">
        <img
          src="https://i.pinimg.com/1200x/32/1e/13/321e13b9abf47c5249086557894a2d4d.jpg"
          alt="Doctor Emily Sophia Anderson"
          class="image-dcotors"
        />

        <h3 class="title-doctors-name">Drs. Emily Sophia Anderson</h3>

        <p class="text-descer-doctors">
          Psychiatry — focuses on diagnosing and treating mental, emotional, and
          behavioral disorders.
        </p>
      </div>

      <!-- Appointment Form -->
      <section>
        <form action="" class="doctors-form">
          <div class="patient-form">
            <div class="form-group">
              <label for="full-name">Full Name</label>
              <input
                type="text"
                id="full-name"
                name="name"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone-number">Phone Number</label>
              <input
                type="tel"
                id="phone-number"
                name="phone-number"
                placeholder="Enter your phone number"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <!-- Gender -->
          <div class="radio">
            <span class="gender-title">Gender</span>

            <label>
              <input type="radio" name="gender" value="Male" required />
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="Female" />
              Female
            </label>
          </div>
          <!-- Date -->
          <div class="form-group">
            <label for="date">Appointment Date</label>
            <input type="datetime-local" name="date" id="date" required />
          </div>
          <!-- Message -->
          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              placeholder="Write your message..."
            ></textarea>
          </div>
          <button type="submit" class="btn-appoimment">Make Appointment</button>
        </form>
      </section>
    </main>
  </body>
</html>
